<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            height: 100px;
            width: 100px;
            object-fit: cover;
            border: 1px solid green;
        }
        .add{
            display: none;
        }
    </style>
</head>
<body>
    <button style="background-color: orange; border-radius: 6px; cursor: pointer; padding: 6px 8px;">Show image</button> <br> <br>
    <img src="https://img.freepik.com/premium-photo/portrait-shree-krishna-radha-rani_1037680-14432.jpg?w=2000" alt="image">
</body>
<script>
    let img=document.querySelector("img");
    let btn=document.querySelector("button")
    btn.addEventListener("click",(e)=>
    {
        img.classList.toggle("add");
    })
</script>
</html>
